name: "CI: Windows Build & Test"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["master", "main"]
    paths:
      - "src/**"
      - "browser/**"
      - "ui/**"
      - "mcp/**"
      - "tests/**"
      - "*.sln"
      - "*.slnx"
  pull_request:
    branches: ["master", "main"]
    paths:
      - "src/**"
      - "browser/**"
      - "ui/**"
      - "mcp/**"
      - "tests/**"
      - "*.sln"
      - "*.slnx"

permissions:
  contents: read
  checks: write
  pull-requests: write # required for test result comments

jobs:
  build:
    name: Windows
    uses: ./.github/workflows/_build.yml
    with:
      os: windows-latest
      project: Facebook.Net.slnx
      test: Facebook.Net.slnx
      deploy: false
      coverage: false
