name: "Template: Build & Test"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_CLI_USE_MSBUILD_SERVER: false

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      os:
        description: "Target OS (windows-latest)"
        required: true
        type: string
      project:
        description: "Path to .slnx or .csproj file"
        required: true
        type: string

jobs:
  build:
    name: "Build & Test (${{ inputs.os }})"
    runs-on: ${{ inputs.os }}

    concurrency:
      group: build-${{ inputs.os }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Decode signing key
        shell: bash
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "${{ secrets.SIGNING_KEY }}" | base64 -d > "$GITHUB_WORKSPACE/src/Facebook.Net.snk"
          fi

      - name: Restore solution
        shell: bash
        run: dotnet restore "${{ inputs.project }}"

      - name: Build solution
        shell: bash
        timeout-minutes: 10
        run: dotnet build "${{ inputs.project }}" -c Release --no-restore -m

      - name: Run unit tests
        shell: bash
        timeout-minutes: 10
        run: dotnet test "${{ inputs.project }}" -c Release --no-build --no-restore -m
